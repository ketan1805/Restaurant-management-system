{% extends 'restaurant/base_auth.html' %}
{% block title %}FoodVerse · Forgot Password{% endblock %}

{% block content %}
<div class="form-container">
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-envelope-open-text"></i></div>
        <span class="logo-text">FoodVerse</span>
    </div>

    <div class="form-header">
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a 6-digit OTP</p>
    </div>

    <form method="post" action="{% url 'forgot_password' %}">
        {% csrf_token %}

        <div class="form-group">
            <div class="input-group-custom">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" name="email" placeholder="Email Address" required />
            </div>
        </div>

        <button type="submit" class="btn-primary-custom">
            <span class="loader"></span>
            <span class="btn-text">Send OTP</span>
            <i class="fas fa-paper-plane"></i>
        </button>

        <div class="form-footer">
            <a href="{% url 'login' %}" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </form>
</div>
{% endblock %}
