{% extends 'restaurant/base_auth.html' %}
{% block title %}FoodVerse · Change Password{% endblock %}

{% block content %}
<div class="form-container wide">
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-key"></i></div>
        <span class="logo-text">FoodVerse</span>
    </div>

    <div class="form-header">
        <h2>Change Password</h2>
        <p>Enter your current password and choose a new one</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="has-toggle" id="old_password"
                       name="old_password" placeholder="Current Password" required />
                <button type="button" class="toggle-pass"
                        onclick="togglePassword('old_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-group">
            <div class="input-group-custom">
                <i class="fas fa-key input-icon"></i>
                <input type="password" class="has-toggle" id="new_password1"
                       name="new_password1" placeholder="New Password" required />
                <button type="button" class="toggle-pass"
                        onclick="togglePassword('new_password1', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <small class="input-hint">Minimum 8 characters, mix letters &amp; numbers</small>
        </div>

        <div class="form-group">
            <div class="input-group-custom">
                <i class="fas fa-shield-halved input-icon"></i>
                <input type="password" class="has-toggle" id="new_password2"
                       name="new_password2" placeholder="Confirm New Password" required />
                <button type="button" class="toggle-pass"
                        onclick="togglePassword('new_password2', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary-custom">
            <span class="loader"></span>
            <span class="btn-text">Update Password</span>
            <i class="fas fa-check"></i>
        </button>

        <div class="form-footer">
            <a href="{% url 'home' %}" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </form>
</div>
{% endblock %}
