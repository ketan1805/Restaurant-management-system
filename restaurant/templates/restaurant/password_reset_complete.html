{% extends 'restaurant/base_auth.html' %}
{% block title %}FoodVerse · Password Reset Complete{% endblock %}

{% block content %}
<div class="form-container">
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-check-circle"></i></div>
        <span class="logo-text">FoodVerse</span>
    </div>

    <div class="success-badge">
        <i class="fas fa-check"></i>
    </div>

    <div class="form-header">
        <h2>Password Reset!</h2>
        <p>Your password has been set successfully. You can now login with your new password.</p>
    </div>

    <a href="{% url 'login' %}" class="btn-primary-custom">
        <span class="btn-text">Go to Login</span>
        <i class="fas fa-arrow-right"></i>
    </a>
</div>
{% endblock %}
