{% extends 'restaurant/base_auth.html' %}
{% block title %}FoodVerse · Email Sent{% endblock %}

{% block content %}
<div class="form-container">
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-envelope-open-text"></i></div>
        <span class="logo-text">FoodVerse</span>
    </div>

    <div class="success-badge">
        <i class="fas fa-paper-plane"></i>
    </div>

    <div class="form-header">
        <h2>Check Your Email</h2>
        <p>We've sent a password reset link to your email. Please check your inbox and follow the instructions.</p>
    </div>

    <div class="form-footer" style="margin-top:1rem;">
        <a href="{% url 'login' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>
</div>
{% endblock %}
