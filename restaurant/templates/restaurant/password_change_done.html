{% extends 'restaurant/base_auth.html' %}
{% block title %}FoodVerse · Password Changed{% endblock %}

{% block content %}
<div class="form-container">
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-check-circle"></i></div>
        <span class="logo-text">FoodVerse</span>
    </div>

    <div class="success-badge">
        <i class="fas fa-check"></i>
    </div>

    <div class="form-header">
        <h2>Password Changed!</h2>
        <p>Your password has been updated successfully. Use your new password next time you log in.</p>
    </div>

    <a href="{% url 'home' %}" class="btn-primary-custom">
        <span class="btn-text">Go to Home</span>
        <i class="fas fa-arrow-right"></i>
    </a>
</div>
{% endblock %}
