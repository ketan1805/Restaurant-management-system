{% extends 'restaurant/base_auth.html' %}
{% block title %}FoodVerse · New Password{% endblock %}

{% block content %}
<div class="form-container wide">
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-lock"></i></div>
        <span class="logo-text">FoodVerse</span>
    </div>

    <div class="form-header">
        <h2>Set New Password</h2>
        <p>Choose a strong password for your account</p>
    </div>

    <form method="post" action="{% url 'set_new_password' user.id %}">
        {% csrf_token %}

        <div class="form-group">
            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="has-toggle" id="new_password"
                       name="new_password" placeholder="New Password" required />
                <button type="button" class="toggle-pass"
                        onclick="togglePassword('new_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <small class="input-hint">Minimum 8 characters</small>
        </div>

        <div class="form-group">
            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="has-toggle" id="confirm_password"
                       name="confirm_password" placeholder="Confirm New Password" required />
                <button type="button" class="toggle-pass"
                        onclick="togglePassword('confirm_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary-custom">
            <span class="loader"></span>
            <span class="btn-text">Reset Password</span>
            <i class="fas fa-check"></i>
        </button>

        <div class="form-footer">
            <a href="{% url 'login' %}" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </form>
</div>
{% endblock %}
